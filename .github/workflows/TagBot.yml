name: TagBot
on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      lookback:
        description: "[DEPRECATED] No longer has any effect"
        default: "3"
jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    # ubuntu-slim doesn't support containers, and thus won't work
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@a761b867f05e7e410011ab16b244f2fffec16c85 # v1.26.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Deploy key: a tag pushed with it triggers the Documentation workflow, which builds
          # the documentation of the version (a tag pushed with GITHUB_TOKEN would not).
          ssh: ${{ secrets.DOCUMENTER_KEY }}
